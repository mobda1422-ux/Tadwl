<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1f6b4f">
<title>تداول افتراضي — محاكي السوق السعودي</title>
<style>
:root{--bg:#f4f7f4;--card:#fff;--text:#17221d;--muted:#6d7a73;--primary:#1f6b4f;--primary2:#2f8a67;--border:#dce5df;--danger:#c84747;--good:#16835a;--warn:#b57a16;--shadow:0 8px 25px #183b2a12}
[data-theme=dark]{--bg:#101613;--card:#18211d;--text:#edf5f0;--muted:#9eaaa4;--primary:#59b58c;--primary2:#3e936e;--border:#2b3932;--danger:#ef7474;--good:#52c694;--warn:#e6b45b;--shadow:0 8px 25px #0005}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif}
button,input,select{font:inherit}button{cursor:pointer;border:0}.app{max-width:1400px;margin:auto;padding:16px 16px 90px}
.top{display:flex;align-items:center;gap:12px;justify-content:space-between;position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);padding:10px 0}
.brand{display:flex;align-items:center;gap:10px}.logo{width:44px;height:44px;border-radius:14px;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:900;font-size:21px}.brand h1{font-size:19px;margin:0}.brand small{color:var(--muted)}
.actions{display:flex;gap:7px;flex-wrap:wrap}.iconbtn,.pill,.btn{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:11px;padding:9px 12px}.btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}.btn.danger{background:var(--danger);color:#fff;border-color:var(--danger)}
.nav{display:flex;gap:7px;overflow:auto;padding:8px 0 12px;position:sticky;top:64px;z-index:4;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(8px)}
.nav button{white-space:nowrap;border:1px solid var(--border);background:var(--card);color:var(--muted);padding:9px 13px;border-radius:999px}.nav button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.col12{grid-column:span 12}.col8{grid-column:span 8}.col6{grid-column:span 6}.col4{grid-column:span 4}.col3{grid-column:span 3}
.card{background:var(--card);border:1px solid var(--border);border-radius:17px;padding:16px;box-shadow:var(--shadow)}.card h2,.card h3{margin:0 0 12px}.muted{color:var(--muted)}.num{font-size:28px;font-weight:900}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.wrap{flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{padding:14px;border:1px solid var(--border);border-radius:14px;background:color-mix(in srgb,var(--card) 90%,var(--primary) 10%)}.stat b{display:block;font-size:21px;margin-top:5px}
.green{color:var(--good)}.red{color:var(--danger)}.yellow{color:var(--warn)}
table{width:100%;border-collapse:collapse}th,td{padding:10px 7px;border-bottom:1px solid var(--border);text-align:right;font-size:13px}th{color:var(--muted);font-weight:700}
input,select{width:100%;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:10px;outline:none}.field{display:grid;gap:6px;margin-bottom:10px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stock{display:flex;justify-content:space-between;align-items:center;padding:12px;border:1px solid var(--border);border-radius:13px;margin-bottom:8px}.tag{font-size:11px;padding:4px 7px;border-radius:999px;background:color-mix(in srgb,var(--primary) 13%,var(--card));color:var(--primary)}
.heat{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.heat div{min-height:65px;border-radius:10px;padding:8px;display:flex;flex-direction:column;justify-content:center}.heat .up{background:#dff4e9;color:#126844}.heat .dn{background:#f9dddd;color:#9e2d2d}.heat .flat{background:#e9eee9;color:#4f5e56}[data-theme=dark] .heat .up{background:#173f2f;color:#72d2a6}[data-theme=dark] .heat .dn{background:#472020;color:#f08a8a}[data-theme=dark] .heat .flat{background:#29332e;color:#b7c2bc}
.chart{width:100%;height:230px;border:1px solid var(--border);border-radius:12px;background:color-mix(in srgb,var(--card) 96%,var(--primary) 4%);padding:8px}.chart svg{width:100%;height:100%}
.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:16px;z-index:20}.modalbox{max-width:560px;width:100%;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:18px;max-height:90vh;overflow:auto}.toast{position:fixed;bottom:18px;left:18px;background:var(--text);color:var(--bg);padding:12px 16px;border-radius:12px;z-index:30;box-shadow:var(--shadow)}
.ordergrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.buy{border-top:4px solid var(--good)}.sell{border-top:4px solid var(--danger)}
.footer{text-align:center;color:var(--muted);padding:25px 0;font-size:12px}.notice{padding:11px;border-radius:12px;background:#fff4d7;color:#73500e;margin-bottom:10px}[data-theme=dark] .notice{background:#3c3019;color:#e9c879}
@media(max-width:900px){.col8,.col6,.col4,.col3{grid-column:span 12}.stats{grid-template-columns:repeat(2,1fr)}.heat{grid-template-columns:repeat(3,1fr)}}
@media(max-width:600px){.app{padding:10px 10px 80px}.top{top:0}.nav{top:62px}.brand h1{font-size:16px}.stats{grid-template-columns:1fr 1fr}.ordergrid,.formgrid{grid-template-columns:1fr}.heat{grid-template-columns:repeat(2,1fr)}.card{padding:13px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
const SECTORS=[
["البنوك والخدمات المالية",["مصرف النخبة","بنك الريادة","بنك الأمان","مصرف الواحة","بنك النمو","مصرف الثروة","بنك القمة"]],
["الطاقة",["طاقة الصحراء","الوقود المتقدم","طاقة نجد","مصادر المستقبل","الطاقة الوطنية","حقول الخليج","شمس الطاقة"]],
["المواد الأساسية",["معادن الخليج","صناعات الصلب","الأسمنت المتين","مواد البناء المتحدة","كيماويات الشرق","حديد نجد","المواد الحديثة"]],
["السلع الرأسمالية",["معدات الجزيرة","حلول الصناعة","الآلات السعودية","تقنيات الإنشاء","معدات الخليج","المصانع الذكية","الأنظمة المتقدمة"]],
["الخدمات التجارية والمهنية",["أعمال نجد","حلول الأعمال","الاستشارات العربية","الخدمات المتكاملة","رواد الخدمات","إسناد الأعمال","الخبرة المتحدة"]],
["النقل",["نقل الخليج","لوجستيات نجد","الموانئ المتحدة","مسارات النقل","الشحن السريع","أسطول الجزيرة","حلول الإمداد"]],
["السلع طويلة الأجل",["منزل المستقبل","أثاث نجد","صناعة الخليج","المنتجات العصرية","بيوت السعودية","الرفاهية المتحدة","تصميم المنزل"]],
["الخدمات الاستهلاكية",["خدمات الحياة","ترفيه نجد","رعاية الأسرة","الضيافة العربية","خدمات المدن","الحياة العصرية","التجارب المتحدة"]],
["الإعلام والترفيه",["إعلام المستقبل","منصة العرب","صوت الخليج","محتوى نجد","إبداع الإعلام","مشاهد العربية","الترفيه الوطني"]],
["الأغذية والمشروبات",["غذاء السعودية","مذاق الخليج","أغذية نجد","المزارع المتحدة","المنتجات الطازجة","غذاء المستقبل","سلة الوطن"]],
["التجزئة",["متاجر الجزيرة","أسواق نجد","تجزئة الخليج","سوق المستقبل","متاجر الوطن","تسوق العربية","البيع الحديث"]],
["الاتصالات",["اتصالات نجد","شبكات الخليج","تقنية الاتصال","الربط الوطني","الاتصالات المتقدمة","شبكة المستقبل","حلول الاتصالات"]],
["المرافق",["مياه الوطن","كهرباء المستقبل","مرافق نجد","خدمات الطاقة","المياه المتحدة","مرافق الخليج","المدن الذكية"]],
["الرعاية الصحية",["صحة الخليج","رعاية نجد","مستشفيات المستقبل","دواء الوطن","الرعاية المتحدة","الحلول الطبية","صحة الحياة"]],
["التقنية",["تقنية السعودية","ذكاء نجد","حلول رقمية","سحابة الخليج","برمجيات المستقبل","تقنية الأعمال","الأنظمة الرقمية"]]
];
const PREFIX=["BNK","ENR","MAT","CAP","BUS","TRN","DUR","CON","MED","FNB","RTL","TEL","UTL","HLT","TEC"];
const strength=["قوية","قوية","متوسطة","قوية","متوسطة","قوية","متوسطة"];
const prices=[38,72,25,55,18,96,44];
const caps=[50000000,150000000,300000000,700000000,1500000000,3000000000,10000000000];
let companies=[];
SECTORS.forEach((s,si)=>s[1].forEach((name,i)=>{
  const price=prices[i], capital=caps[i];
  companies.push({id:si*7+i+1,symbol:PREFIX[si]+String(i+1).padStart(2,"0"),name,sector:s[0],sectorId:si,price,prev:price,high:price,low:price,week:((i*3+si)%15)-7,capital,shares:Math.floor(capital/price),strength:strength[i],sentiment:0});
}));

const LS="virtual_tadawul_v1";
const state=JSON.parse(localStorage.getItem(LS)||"null")||{
 theme:"light", page:"home", user:{name:"متداول تجريبي",wallet:0}, cash:50000,
 portfolios:[{id:1,name:"المحفظة الرئيسية",cash:50000,holdings:{},roi:0}],
 orders:[], trades:[], selected:companies[0].symbol, notifications:[], news:[],
 event:null, competition:{active:true,name:"كأس المتداولين",days:7},
 botUsers:[
  {name:"سلمان",cash:50000,nav:50000},
  {name:"نورة",cash:50000,nav:50000},
  {name:"عبدالله",cash:50000,nav:50000},
  {name:"ريم",cash:50000,nav:50000}
 ],
 adminLogged:false, makerCash:1000000000, makerSeeded:false, lastSave:Date.now()
};

function save(){state.lastSave=Date.now();localStorage.setItem(LS,JSON.stringify(state))}
function money(n){return new Intl.NumberFormat("ar-SA",{minimumFractionDigits:2,maximumFractionDigits:2}).format(n)+" ر.س"}
function num(n){return new Intl.NumberFormat("ar-SA",{maximumFractionDigits:0}).format(n)}
function pct(n){return (n>=0?"+":"")+Number(n).toFixed(2)+"%"}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function company(sym){return companies.find(x=>x.symbol===sym)}
function holding(sym){return state.portfolios[0].holdings[sym]||0}
function notify(t){state.notifications.unshift({id:Date.now(),text:t,time:new Date().toLocaleTimeString("ar-SA",{hour:"2-digit",minute:"2-digit"})});state.notifications=state.notifications.slice(0,15);toast(t);save()}
let toastTimer;
function toast(t){clearTimeout(toastTimer);const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);toastTimer=setTimeout(()=>d.remove(),2800)}
function dailyBand(c){return {min:c.prev*.9,max:c.prev*1.1}}
function seedMarket(){
 if(state.makerSeeded)return;
 companies.forEach(c=>{
  const q=Math.max(100,Math.floor(c.shares*.0005));
  state.orders.push({id:"M-S-"+c.symbol,owner:"market",side:"sell",symbol:c.symbol,price:+Math.min(dailyBand(c).max,c.price*1.002).toFixed(2),qty:q,remaining:q,created:Date.now()});
  state.orders.push({id:"M-B-"+c.symbol,owner:"market",side:"buy",symbol:c.symbol,price:+Math.max(dailyBand(c).min,c.price*.998).toFixed(2),qty:q,remaining:q,created:Date.now()});
 });
 state.makerSeeded=true;save();
}
seedMarket();

function placeOrder(side,sym,price,qty){
 price=+price;qty=Math.floor(qty);
 const c=company(sym), p=state.portfolios[0];
 if(!c||price<=0||qty<=0)return toast("تحقق من السعر والكمية");
 const band=dailyBand(c);
 if(price<band.min||price>band.max)return toast("السعر خارج النطاق اليومي ±10%");
 if(side==="buy"){
   const cost=price*qty*1.00155;
   if(p.cash<cost)return toast("الرصيد النقدي غير كافٍ");
   p.cash-=cost;
 }else{
   if(holding(sym)<qty)return toast("عدد الأسهم غير كافٍ للبيع");
   p.holdings[sym]-=qty;
 }
 const o={id:"U-"+Date.now()+"-"+Math.random().toString(36).slice(2),owner:"user",side,symbol:sym,price,qty,remaining:qty,created:Date.now()};
 state.orders.push(o);match(sym);save();render();
}
function match(sym){
 let buys=state.orders.filter(o=>o.symbol===sym&&o.remaining>0&&o.side==="buy").sort((a,b)=>b.price-a.price||a.created-b.created);
 let sells=state.orders.filter(o=>o.symbol===sym&&o.remaining>0&&o.side==="sell").sort((a,b)=>a.price-b.price||a.created-b.created);
 while(buys[0]&&sells[0]&&buys[0].price>=sells[0].price){
  const b=buys[0],s=sells[0],q=Math.min(b.remaining,s.remaining),px=s.owner==="user"?b.price:s.price;
  const c=company(sym), fee=px*q*.00155;
  b.remaining-=q;s.remaining-=q;
  if(b.owner==="user"){
    state.portfolios[0].holdings[sym]=(state.portfolios[0].holdings[sym]||0)+q;
    state.portfolios[0].cash-=Math.max(0,(px*q+fee)-(b.price*q*.00155));
  }
  if(s.owner==="user"){state.portfolios[0].cash+=px*q-fee;state.portfolios[0].holdings[sym]=(state.portfolios[0].holdings[sym]||0)+q}
  c.price=Math.min(dailyBand(c).max,Math.max(dailyBand(c).min,+px.toFixed(2)));
  c.high=Math.max(c.high,c.price);c.low=Math.min(c.low,c.price);
  state.trades.unshift({time:Date.now(),symbol:sym,price:px,qty:q,fee,side:b.owner==="user"?"شراء":"بيع"});
  notify("تم تنفيذ "+(b.owner==="user"?"شراء":"بيع")+" "+num(q)+" سهم من "+c.name);
  buys=state.orders.filter(o=>o.symbol===sym&&o.remaining>0&&o.side==="buy").sort((a,b)=>b.price-a.price||a.created-b.created);
  sells=state.orders.filter(o=>o.symbol===sym&&o.remaining>0&&o.side==="sell").sort((a,b)=>a.price-b.price||a.created-b.created);
 }
}
function expireOrders(){
 const now=Date.now();
 state.orders.forEach(o=>{
  if(o.remaining>0&&now-o.created>=86400000){
   if(o.owner==="user"){
    const c=company(o.symbol);
    if(o.side==="buy")state.portfolios[0].cash+=o.price*o.remaining*1.00155;
    else state.portfolios[0].holdings[o.symbol]=(state.portfolios[0].holdings[o.symbol]||0)+o.remaining;
    notify("انتهت صلاحية أمر "+c.name+" بعد 24 ساعة");
   }
   o.remaining=0;o.expired=true;
  }
 });
 save();
}
setInterval(expireOrders,30000);
function nav(page){state.page=page;save();render()}
function navHtml(){
 const items=[["home","الرئيسية"],["market","السوق"],["portfolio","محفظتي"],["leaderboard","المتصدرون"],["ipo","الاكتتابات"],["news","الأخبار"],["tools","الأدوات"],["admin","الإدارة"]];
 return `<div class="nav">${items.map(x=>`<button class="${state.page===x[0]?"active":""}" onclick="nav('${x[0]}')">${x[1]}</button>`).join("")}</div>`;
}
function header(){
 return `<div class="top"><div class="brand"><div class="logo">ت</div><div><h1>تداول افتراضي</h1><small>محاكي السوق السعودي — أموال افتراضية</small></div></div><div class="actions"><button class="iconbtn" onclick="toggleTheme()">◐</button><button class="iconbtn" onclick="showNotifications()">🔔 ${state.notifications.length}</button></div></div>${navHtml()}`;
}
function toggleTheme(){state.theme=state.theme==="dark"?"light":"dark";document.documentElement.dataset.theme=state.theme;save();render()}
function home(){
 const total=portfolioNAV(), roi=(total-50000)/50000*100;
 return `<div class="grid">
 <div class="col12 card"><div class="row wrap"><div><h2>مرحباً ${esc(state.user.name)} 👋</h2><div class="muted">جرّب التداول بدون مخاطرة مالية حقيقية.</div></div><button class="btn primary" onclick="nav('market')">ابدأ التداول</button></div></div>
 <div class="col12 stats"><div class="stat">القيمة الإجمالية<b>${money(total)}</b></div><div class="stat">النقد المتاح<b>${money(state.portfolios[0].cash)}</b></div><div class="stat">العائد<b class="${roi>=0?"green":"red"}">${pct(roi)}</b></div><div class="stat">عدد الأسهم<b>${num(Object.values(state.portfolios[0].holdings).reduce((a,b)=>a+b,0))}</b></div></div>
 <div class="col8 card"><h3>مؤشر السوق العام</h3>${chartSvg()}<div class="row muted"><span>آخر تحديث: الآن</span><span>النطاق اليومي لكل سهم: ±10%</span></div></div>
 <div class="col4 card"><h3>أسهم نشطة</h3>${companies.slice(0,6).map(stockRow).join("")}</div>
 <div class="col12 card"><h3>خريطة القطاعات</h3><div class="heat">${SECTORS.map((s,i)=>{let v=((i*7+3)%17)-8;return `<div class="${v>0?"up":v<0?"dn":"flat"}"><b>${s[0]}</b><span>${pct(v)}</span></div>`}).join("")}</div></div>
 </div>`;
}
function stockRow(c){
 const ch=(c.price-c.prev)/c.prev*100;
 return `<div class="stock" onclick="selectStock('${c.symbol}')"><div><b>${esc(c.name)}</b><div class="muted">${c.symbol} · ${esc(c.sector)}</div></div><div style="text-align:left"><b>${money(c.price)}</b><div class="${ch>=0?"green":"red"}">${pct(ch)}</div></div></div>`;
}
function selectStock(sym){state.selected=sym;state.page="company";save();render()}
function market(){
 return `<div class="grid"><div class="col12 card"><div class="row wrap"><div><h2>السوق السعودي الافتراضي</h2><div class="muted">105 شركة خيالية موزعة على 15 قطاعاً</div></div><input style="max-width:300px" id="search" placeholder="ابحث عن شركة أو رمز" oninput="renderMarket(this.value)"></div></div><div class="col12 card" id="marketList">${companies.slice(0,35).map(stockRow).join("")}</div></div>`;
}
function renderMarket(q=""){const el=document.getElementById("marketList");if(el)el.innerHTML=companies.filter(c=>(c.name+" "+c.symbol+" "+c.sector).includes(q)).map(stockRow).join("")}
function companyPage(){
 const c=company(state.selected)||companies[0], ch=(c.price-c.prev)/c.prev*100,b=dailyBand(c);
 const buys=state.orders.filter(o=>o.symbol===c.symbol&&o.remaining>0&&o.side==="buy").sort((a,b)=>b.price-a.price).slice(0,8);
 const sells=state.orders.filter(o=>o.symbol===c.symbol&&o.remaining>0&&o.side==="sell").sort((a,b)=>a.price-b.price).slice(0,8);
 return `<div class="grid"><div class="col12 card"><div class="row wrap"><div><h2>${esc(c.name)} <span class="tag">${c.symbol}</span></h2><div class="muted">${esc(c.sector)} · القوة الاقتصادية: ${c.strength}</div></div><div><span class="${ch>=0?"green":"red"} num">${money(c.price)}</span><span class="${ch>=0?"green":"red"}"> ${pct(ch)}</span></div></div></div>
 <div class="col8 card"><h3>الرسم السعري</h3>${stockChart(c)}<div class="stats"><div class="stat">أعلى 52 أسبوع<b>${money(c.high*1.18)}</b></div><div class="stat">أدنى 52 أسبوع<b>${money(c.low*.84)}</b></div><div class="stat">السعر الأدنى اليوم<b>${money(b.min)}</b></div><div class="stat">السعر الأعلى اليوم<b>${money(b.max)}</b></div></div></div>
 <div class="col4 card"><h3>تنفيذ صفقة</h3><div class="formgrid"><div class="field"><label>العملية</label><select id="side"><option value="buy">شراء</option><option value="sell">بيع</option></select></div><div class="field"><label>الكمية</label><input id="qty" type="number" min="1" value="10"></div></div><div class="field"><label>السعر</label><input id="price" type="number" step=".01" value="${c.price.toFixed(2)}"></div><button class="btn primary" style="width:100%" onclick="submitOrder('${c.symbol}')">إرسال الأمر</button><p class="muted">العمولة 0.155%، والأمر يطابق فقط أوامر مقابلة موجودة فعلياً.</p></div>
 <div class="col6 card buy"><h3>أوامر الشراء</h3>${orderRows(buys)}</div><div class="col6 card sell"><h3>أوامر البيع</h3>${orderRows(sells)}</div>
 <div class="col12 card"><h3>آخر الصفقات</h3>${state.trades.filter(t=>t.symbol===c.symbol).slice(0,10).map(t=>`<div class="row" style="padding:8px 0;border-bottom:1px solid var(--border)"><span>${new Date(t.time).toLocaleTimeString("ar-SA")}</span><b>${money(t.price)}</b><span>${num(t.qty)} سهم</span></div>`).join("")||'<div class="muted">لا توجد صفقات بعد.</div>'}</div></div>`;
}
function orderRows(arr){return arr.length?arr.map(o=>`<div class="row" style="padding:7px 0;border-bottom:1px solid var(--border)"><span>${money(o.price)}</span><span>${num(o.remaining)}</span><span class="muted">${o.owner==="market"?"صانع السوق":"متداول"}</span></div>`).join(""):'<div class="muted">لا توجد أوامر مقابلة.</div>'}
function submitOrder(sym){placeOrder(document.getElementById("side").value,sym,document.getElementById("price").value,document.getElementById("qty").value)}
function portfolioNAV(){return state.portfolios[0].cash+Object.entries(state.portfolios[0].holdings).reduce((s,[sym,q])=>s+q*company(sym).price,0)}
function portfolio(){
 const p=state.portfolios[0], nav=portfolioNAV(), roi=(nav-50000)/50000*100;
 return `<div class="grid"><div class="col12 card"><div class="row"><div><h2>${esc(p.name)}</h2><div class="muted">رقم المحفظة #1 · هدية البداية 50,000 ر.س</div></div><div class="num">${money(nav)}</div></div></div>
 <div class="col12 stats"><div class="stat">القيمة<b>${money(nav)}</b></div><div class="stat">النقد<b>${money(p.cash)}</b></div><div class="stat">العائد<b class="${roi>=0?"green":"red"}">${pct(roi)}</b></div><div class="stat">عمولة التداول<b>0.155%</b></div></div>
 <div class="col8 card"><h3>المراكز</h3>${Object.entries(p.holdings).filter(x=>x[1]>0).map(([sym,q])=>{const c=company(sym);return `<div class="stock"><div><b>${c.name}</b><div class="muted">${sym}</div></div><div><b>${num(q)} سهم</b><div>${money(q*c.price)}</div></div></div>`}).join("")||'<div class="muted">لم تشترِ أسهماً بعد.</div>'}</div>
 <div class="col4 card"><h3>أوامري المعلقة</h3>${state.orders.filter(o=>o.owner==="user"&&o.remaining>0).map(o=>`<div class="stock"><div><b>${o.side==="buy"?"شراء":"بيع"} ${o.symbol}</b><div class="muted">${money(o.price)}</div></div><b>${num(o.remaining)}</b></div>`).join("")||'<div class="muted">لا توجد أوامر معلقة.</div>'}</div></div>`;
}
function leaderboard(){
 const me={name:state.user.name,nav:portfolioNAV(),roi:(portfolioNAV()-50000)/50000*100};
 const arr=[...state.botUsers,me].map(x=>x.nav?x:{...x,nav:me.nav,roi:me.roi}).sort((a,b)=>b.nav-a.nav);
 return `<div class="grid"><div class="col12 card"><h2>المتصدرون 🏆</h2><div class="notice">في نسخة GitHub المجانية هذه، المتصدرون محليون على نفس المتصفح. النسخة متعددة المستخدمين تحتاج خادماً وقاعدة بيانات.</div><table><thead><tr><th>#</th><th>المتداول</th><th>القيمة</th><th>العائد</th></tr></thead><tbody>${arr.map((x,i)=>`<tr><td>${i+1}</td><td><b>${esc(x.name)}</b></td><td>${money(x.nav)}</td><td class="${(x.roi||0)>=0?"green":"red"}">${pct(x.roi||0)}</td></tr>`).join("")}</tbody></table></div>
 <div class="col6 card"><h3>المسابقة الحالية</h3><p><b>${state.competition.name}</b></p><p class="muted">البداية الافتراضية: 50,000 ر.س · المدة: ${state.competition.days} أيام</p><button class="btn primary" onclick="toast('تم تسجيلك في المسابقة التجريبية')">انضمام</button></div>
 <div class="col6 card"><h3>الإنجازات</h3><p>🏅 أول صفقة — ${state.trades.length?"مكتمل":"قيد الإنجاز"}</p><p>🔥 5 قطاعات — قيد الإنجاز</p><p>💰 +100% عائد — قيد الإنجاز</p></div></div>`;
}
function ipo(){
 const items=[["شركة آفاق التقنية","TEC08",new Date(Date.now()+86400000*2)],["شركة رعاية المستقبل","HLT08",new Date(Date.now()+86400000*5)],["شركة لوجستيات ذكية","TRN08",new Date(Date.now()+86400000*8)]];
 return `<div class="grid"><div class="col12 card"><h2>الاكتتابات والإدراجات</h2><div class="muted">عروض تجريبية خيالية لغرض المحاكاة.</div></div>${items.map(x=>`<div class="col4 card"><span class="tag">قريباً</span><h3>${x[0]}</h3><p class="muted">${x[1]}</p><div class="num">${countdown(x[2])}</div><button class="btn primary" onclick="toast('تمت محاكاة الاكتتاب بنجاح')">اكتتب افتراضياً</button></div>`).join("")}</div>`;
}
function countdown(d){const h=Math.max(0,Math.floor((d-Date.now())/3600000)),m=Math.floor(((d-Date.now())%3600000)/60000);return h+"س "+m+"د"}
function news(){
 if(!state.news.length) state.news=[{t:"نمو متوقع في قطاع التقنية",sector:"التقنية",impact:"+4.2%"},{t:"تحسن في مؤشرات الخدمات",sector:"الخدمات الاستهلاكية",impact:"+2.1%"},{t:"ضغوط على أسعار المواد الأساسية",sector:"المواد الأساسية",impact:"-3.0%"}];
 return `<div class="grid"><div class="col12 card"><h2>الأخبار والأحداث الاقتصادية</h2><div class="muted">الأخبار تؤثر على معنويات القطاع وإعادة تسعير عروض السيولة، ولا تنشئ صفقات من دون أوامر فعلية.</div></div>${state.news.map(n=>`<div class="col4 card"><span class="tag">${n.sector}</span><h3>${n.t}</h3><b class="${n.impact[0]==="-"?"red":"green"}">${n.impact}</b><p class="muted">تأثير محاكى على عروض السوق.</p></div>`).join("")}</div>`;
}
function tools(){
 const total=portfolioNAV(), eligible=total-state.portfolios[0].cash, zak=eligible*.025;
 return `<div class="grid"><div class="col6 card"><h2>حاسبة الزكاة</h2><p class="muted">تقدير مبسط: 2.5% سنوياً على الأصول السائلة المؤهلة في هذه المحاكاة.</p><div class="num">${money(zak)}</div></div>
 <div class="col6 card"><h2>الأدوات المتقدمة</h2><div class="stock"><span>التداول بالهامش</span><button class="btn" onclick="toast('وضع الهامش التجريبي متاح للتطوير')">تجربة</button></div><div class="stock"><span>البيع على المكشوف</span><button class="btn" onclick="toast('البيع على المكشوف يحتاج تفعيل مخزون الاقتراض')">تجربة</button></div><div class="stock"><span>الصكوك والسندات</span><button class="btn" onclick="toast('أداة الصكوك التجريبية قيد المحاكاة')">استعراض</button></div></div>
 <div class="col12 card"><h2>نقل بين المحافظ</h2><div class="formgrid"><div class="field"><label>المبلغ</label><input id="transfer" type="number" value="100"></div><div class="field"><label>المحفظة المستقبلة</label><select><option>المحفظة #2 (فارغة)</option><option>المحفظة #3 (فارغة)</option></select></div></div><button class="btn primary" onclick="transfer()">تنفيذ التحويل</button></div></div>`;
}
function transfer(){const x=+document.getElementById("transfer").value;if(x>0&&x<=state.portfolios[0].cash){state.portfolios[0].cash-=x;notify("تم تحويل "+money(x)+" إلى محفظة فرعية تجريبية");save();render()}else toast("المبلغ غير صالح")}
function admin(){
 if(!state.adminLogged)return `<div class="card"><h2>دخول الإدارة</h2><div class="notice">هذه بيانات دخول تجريبية داخل ملف HTML وليست نظام مصادقة آمناً للإنتاج.</div><div class="field"><label>كلمة المرور</label><input id="adminpass" type="password" placeholder="••••"></div><button class="btn primary" onclick="adminLogin()">دخول</button></div>`;
 return `<div class="grid"><div class="col12 card"><div class="row"><h2>لوحة تحكم مهند</h2><button class="btn danger" onclick="state.adminLogged=false;render()">خروج</button></div></div>
 <div class="col6 card"><h3>إعلان عام</h3><div class="field"><input id="broadcast" placeholder="اكتب إعلاناً لجميع المتداولين"></div><button class="btn primary" onclick="broadcast()">إرسال</button></div>
 <div class="col6 card"><h3>السوق</h3><p>الشركات: <b>105</b></p><p>القطاعات: <b>15</b></p><p>أوامر نشطة: <b>${num(state.orders.filter(o=>o.remaining>0).length)}</b></p><button class="btn" onclick="marketEvent()">توليد حدث اقتصادي</button></div>
 <div class="col12 card"><h3>الشركات</h3><table><thead><tr><th>الرمز</th><th>الشركة</th><th>القطاع</th><th>السعر</th><th>الحالة</th></tr></thead><tbody>${companies.map(c=>`<tr><td>${c.symbol}</td><td>${c.name}</td><td>${c.sector}</td><td>${money(c.price)}</td><td><button class="pill" onclick="toast('تم تغيير حالة ${c.name} تجريبياً')">نشطة</button></td></tr>`).join("")}</tbody></table></div></div>`;
}
function adminLogin(){if(document.getElementById("adminpass").value==="1872"){state.adminLogged=true;save();render()}else toast("كلمة المرور غير صحيحة")}
function broadcast(){const x=document.getElementById("broadcast").value.trim();if(x){notify("إعلان الإدارة: "+x);state.news.unshift({t:x,sector:"إعلان الإدارة",impact:"جديد"});save();render()}}
function marketEvent(){const s=SECTORS[Math.floor(Math.random()*SECTORS.length)][0],up=Math.random()>.4;state.event={sector:s,impact:up?"+":"-"};state.news.unshift({t:(up?"تحسن":"ضغوط")+" اقتصادية محاكاة في "+s,sector:s,impact:up?"+3.5%":"-3.5%"});notify("حدث اقتصادي جديد: "+s);save();render()}
function chartSvg(){
 let pts=[],v=10000;for(let i=0;i<36;i++){v*=1+(Math.sin(i/3)*.002+(i%7-3)*.0005);pts.push(v)}
 return lineChart(pts);
}
function stockChart(c){let pts=[],v=c.prev*.96;for(let i=0;i<40;i++){v*=1+Math.sin(i/4)*.004+(i%9-4)*.0007;pts.push(v)}pts[pts.length-1]=c.price;return lineChart(pts)}
function lineChart(pts){const w=800,h=220,min=Math.min(...pts),max=Math.max(...pts),range=max-min||1;const path=pts.map((v,i)=>`${i?"L":"M"} ${(i/(pts.length-1))*w} ${h-20-((v-min)/range)*(h-35)}`).join(" ");return `<div class="chart"><svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><path d="${path}" fill="none" stroke="currentColor" stroke-width="3"/><line x1="0" y1="${h-20}" x2="${w}" y2="${h-20}" stroke="currentColor" opacity=".12"/></svg></div>`}
function showNotifications(){const x=state.notifications.slice(0,8).map(n=>`<div class="stock"><span>${esc(n.text)}</span><small>${n.time}</small></div>`).join("")||"<p>لا توجد إشعارات.</p>";modal("الإشعارات",x)}
function modal(title,body){const d=document.createElement("div");d.className="modal";d.innerHTML=`<div class="modalbox"><div class="row"><h2>${title}</h2><button class="iconbtn" onclick="this.closest('.modal').remove()">✕</button></div>${body}</div>`;document.body.appendChild(d)}
function appPage(){switch(state.page){case"market":return market();case"company":return companyPage();case"portfolio":return portfolio();case"leaderboard":return leaderboard();case"ipo":return ipo();case"news":return news();case"tools":return tools();case"admin":return admin();default:return home()}}
function render(){document.documentElement.dataset.theme=state.theme;document.getElementById("app").innerHTML=`<div class="app">${header()}${appPage()}<div class="footer">محاكي تعليمي — جميع الشركات والأسعار والأموال افتراضية وليست توصية استثمارية أو بيانات حقيقية من تداول.</div></div>`}
function resetDemo(){if(confirm("سيتم حذف بيانات التجربة المحلية وإعادة 50,000 ر.س. هل تريد المتابعة؟")){localStorage.removeItem(LS);location.reload()}}
window.nav=nav;window.toggleTheme=toggleTheme;window.selectStock=selectStock;window.submitOrder=submitOrder;window.adminLogin=adminLogin;window.broadcast=broadcast;window.marketEvent=marketEvent;window.showNotifications=showNotifications;window.transfer=transfer;window.resetDemo=resetDemo;
render();
</script>
</body>
</html>
