<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>سوق التداول الافتراضي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0e14; --surface:#121926; --surface2:#182130; --border:#212d3d;
    --text:#e9edf3; --muted:#8a96a8; --up:#21c97e; --up-bg:rgba(33,201,126,.12);
    --down:#f0475a; --down-bg:rgba(240,71,90,.12); --gold:#d4a24e; --gold-bg:rgba(212,162,78,.12);
    --blue:#4e8dd4; --purple:#9b7cf0; --purple-bg:rgba(155,124,240,.12);
  }
  [data-theme="light"]{
    --bg:#f4f6f9; --surface:#ffffff; --surface2:#eef1f6; --border:#dde3ec;
    --text:#131a26; --muted:#66738a; --up:#0e9e5e; --up-bg:rgba(14,158,94,.10);
    --down:#d43a4c; --down-bg:rgba(212,58,76,.10); --gold:#b3822f; --gold-bg:rgba(179,130,47,.12);
    --blue:#2f6fc4; --purple:#7357d6; --purple-bg:rgba(115,87,214,.10);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{background:var(--bg); color:var(--text); font-family:'IBM Plex Sans Arabic',Tahoma,Arial,sans-serif; height:100%; overflow-x:hidden;}
  .num{font-family:'IBM Plex Mono','IBM Plex Sans Arabic',monospace; font-variant-numeric:tabular-nums; direction:ltr; unicode-bidi:isolate;}
  #app{max-width:480px; margin:0 auto; min-height:100vh; background:var(--bg); display:flex; flex-direction:column; position:relative;}
  button{font-family:inherit; cursor:pointer;}
  input,select,textarea{font-family:inherit;}

  .ticker-wrap{background:#000; border-bottom:1px solid var(--border); overflow:hidden; white-space:nowrap; padding:6px 0;}
  [data-theme="light"] .ticker-wrap{background:#10141c;}
  .ticker-track{display:inline-block; animation:ticker 40s linear infinite;}
  @keyframes ticker{from{transform:translateX(0);} to{transform:translateX(-50%);}}
  .tick-item{display:inline-flex; gap:6px; align-items:center; padding:0 16px; font-size:12px;}

  header.top{position:sticky; top:0; z-index:20; background:rgba(10,14,20,.92); backdrop-filter:blur(6px); border-bottom:1px solid var(--border);}
  [data-theme="light"] header.top{background:rgba(244,246,249,.92);}
  .topbar{display:flex; align-items:center; justify-content:space-between; padding:10px 14px;}
  .brand{display:flex; align-items:center; gap:8px; font-weight:700; font-size:15px;}
  .brand .dot{width:9px; height:9px; border-radius:50%; background:var(--up); box-shadow:0 0 8px var(--up);}
  .idx{font-size:11.5px; color:var(--muted);}
  .status-pill{font-size:10.5px; padding:3px 9px; border-radius:20px; border:1px solid var(--border);}
  .status-open{color:var(--up); border-color:var(--up); background:var(--up-bg);}
  .user-chip{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted);}
  .role-badge{font-size:10px; background:var(--gold-bg); color:var(--gold); padding:2px 6px; border-radius:6px; border:1px solid rgba(212,162,78,.35);}
  .icon-btn{background:var(--surface); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:5px 8px; font-size:13px;}

  main{flex:1; padding:12px 14px 90px; overflow-y:auto;}

  h1.page-title{font-size:18px; font-weight:700; margin-bottom:10px;}
  .sub{color:var(--muted); font-size:12.5px; line-height:1.7;}

  .search{width:100%; padding:10px 12px; border-radius:10px; background:var(--surface); border:1px solid var(--border); color:var(--text); font-size:13px; margin-bottom:10px;}
  .search:focus{outline:none; border-color:var(--blue);}

  .chip-row{display:flex; gap:6px; overflow-x:auto; padding-bottom:8px; margin-bottom:6px;}
  .chip-row::-webkit-scrollbar{display:none;}
  .chip{flex:0 0 auto; padding:6px 12px; border-radius:20px; background:var(--surface); border:1px solid var(--border); color:var(--muted); font-size:12px; white-space:nowrap;}
  .chip.active{background:var(--blue); color:#fff; border-color:var(--blue);}

  .sector-block{margin-bottom:16px;}
  .sector-head{display:flex; align-items:center; justify-content:space-between; margin:14px 0 6px;}
  .sector-head h3{font-size:13px; color:var(--muted); font-weight:600;}

  .card{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px;}
  .stock-row{display:flex; align-items:center; justify-content:space-between; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:11px 12px; margin-bottom:8px;}
  .stock-left{display:flex; align-items:center; gap:10px; flex:1; min-width:0;}
  .stock-badge{width:34px; height:34px; border-radius:9px; background:var(--surface2); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:var(--muted); flex:0 0 auto;}
  .stock-name{font-size:13.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .stock-sub{font-size:11px; color:var(--muted); margin-top:2px;}
  .stock-right{text-align:left; flex:0 0 auto; padding-right:6px;}
  .price{font-size:14.5px; font-weight:600;}
  .chg{font-size:11.5px; font-weight:600; padding:2px 6px; border-radius:6px; display:inline-block; margin-top:3px;}
  .chg.up{color:var(--up); background:var(--up-bg);} .chg.down{color:var(--down); background:var(--down-bg);} .chg.flat{color:var(--muted); background:var(--surface2);}
  .star-btn{background:none; border:none; font-size:16px; color:var(--muted); padding:4px;}
  .star-btn.active{color:var(--gold);}
  .badge-mini{font-size:9.5px; padding:1px 5px; border-radius:5px; margin-inline-start:5px; font-weight:700;}
  .badge-ipo{background:var(--purple-bg); color:var(--purple); border:1px solid rgba(155,124,240,.35);}
  .badge-halt{background:var(--down-bg); color:var(--down); border:1px solid rgba(240,71,90,.35);}
  .badge-short{background:var(--gold-bg); color:var(--gold); border:1px solid rgba(212,162,78,.35);}

  .empty{text-align:center; color:var(--muted); font-size:13px; padding:40px 10px;}

  nav.bottom{position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px; background:rgba(15,20,28,.97); backdrop-filter:blur(8px); border-top:1px solid var(--border); display:flex; z-index:30;}
  [data-theme="light"] nav.bottom{background:rgba(255,255,255,.97);}
  nav.bottom button{flex:1; background:none; border:none; color:var(--muted); font-size:9.5px; padding:8px 1px 9px; display:flex; flex-direction:column; align-items:center; gap:2px;}
  nav.bottom button .ic{font-size:16px;}
  nav.bottom button.active{color:var(--blue);}

  .login-wrap{min-height:100vh; display:flex; flex-direction:column; justify-content:center; padding:26px;}
  .login-logo{text-align:center; margin-bottom:26px;}
  .login-logo .glyph{font-size:34px;}
  .login-logo h1{font-size:20px; margin-top:8px;}
  .login-logo p{color:var(--muted); font-size:12.5px; margin-top:4px;}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:12px; color:var(--muted); margin-bottom:6px;}
  .field input, .field select, .field textarea{width:100%; padding:11px 12px; border-radius:10px; background:var(--surface); border:1px solid var(--border); color:var(--text); font-size:14px;}
  .role-toggle{display:flex; gap:8px; margin-bottom:14px;}
  .role-opt{flex:1; padding:12px; text-align:center; border-radius:10px; background:var(--surface); border:1px solid var(--border); font-size:13px; color:var(--muted);}
  .role-opt.sel{border-color:var(--blue); color:var(--text); background:var(--surface2);}
  .btn{display:block; width:100%; text-align:center; padding:13px; border-radius:11px; border:none; font-size:14px; font-weight:600; cursor:pointer;}
  .btn-primary{background:var(--blue); color:#fff;}
  .btn-ghost{background:var(--surface); color:var(--text); border:1px solid var(--border);}
  .btn-buy{background:var(--up); color:#062; }
  .btn-sell{background:var(--down); color:#3a0007;}
  .btn-short{background:var(--gold); color:#3a2a05;}
  .btn-outline{background:transparent; border:1px solid var(--border); color:var(--text);}
  .btn-sm{padding:8px 10px; font-size:12px; border-radius:8px;}
  .oauth-row{display:flex; gap:8px; margin:14px 0;}
  .oauth-btn{flex:1; padding:11px; border-radius:10px; background:var(--surface); border:1px solid var(--border); color:var(--text); font-size:12.5px; display:flex; align-items:center; justify-content:center; gap:6px;}
  .divider{display:flex; align-items:center; gap:8px; color:var(--muted); font-size:11px; margin:10px 0;}
  .divider::before,.divider::after{content:""; flex:1; height:1px; background:var(--border);}
  .note{font-size:11px; color:var(--muted); line-height:1.7; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:10px; margin-top:14px;}

  .cd-head{display:flex; align-items:center; gap:12px; margin-bottom:10px;}
  .cd-badge{width:46px; height:46px; border-radius:12px; background:var(--surface2); display:flex; align-items:center; justify-content:center; font-weight:700; color:var(--muted);}
  .cd-price-row{display:flex; align-items:baseline; gap:10px; margin:10px 0 4px;}
  .cd-price{font-size:28px; font-weight:700;}
  .spark{width:100%; height:70px; margin:10px 0;}
  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:12px 0;}
  .stat{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:9px 10px;}
  .stat .l{font-size:10.5px; color:var(--muted); margin-bottom:3px;}
  .stat .v{font-size:13.5px; font-weight:600;}
  .band-bar{height:6px; border-radius:4px; background:var(--surface2); position:relative; margin:6px 0 2px;}
  .band-bar .fill{position:absolute; top:0; bottom:0; width:3px; border-radius:4px; background:var(--gold);}
  .tabs{display:flex; gap:6px; margin:14px 0 10px; flex-wrap:wrap;}
  .tab{flex:1; text-align:center; padding:9px 4px; border-radius:9px; background:var(--surface); border:1px solid var(--border); font-size:12px; color:var(--muted); min-width:70px;}
  .tab.active{background:var(--surface2); color:var(--text); border-color:var(--blue);}
  .trade-panel{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px; margin-top:8px;}
  .qty-row{display:flex; align-items:center; gap:8px; margin:10px 0;}
  .qty-row button{width:36px; height:36px; border-radius:9px; background:var(--surface2); border:1px solid var(--border); color:var(--text); font-size:16px;}
  .qty-row input{flex:1; text-align:center; padding:9px; border-radius:9px; background:var(--surface2); border:1px solid var(--border); color:var(--text); font-size:15px;}
  .trade-summary{font-size:12px; color:var(--muted); display:flex; justify-content:space-between; margin:4px 0;}
  .side-toggle{display:flex; gap:8px; margin-bottom:10px;}
  .side-opt{flex:1; padding:10px; text-align:center; border-radius:9px; background:var(--surface2); border:1px solid var(--border); font-size:13px; font-weight:600; color:var(--muted);}
  .side-opt.buy-sel{border-color:var(--up); color:var(--up); background:var(--up-bg);}
  .side-opt.sell-sel{border-color:var(--down); color:var(--down); background:var(--down-bg);}
  .side-opt.short-sel{border-color:var(--gold); color:var(--gold); background:var(--gold-bg);}

  .order-card{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:11px 12px; margin-bottom:8px;}
  .order-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;}
  .order-side{font-size:11.5px; font-weight:700; padding:2px 7px; border-radius:6px;}
  .order-side.buy{color:var(--up); background:var(--up-bg);} .order-side.sell{color:var(--down); background:var(--down-bg);}
  .order-status{font-size:10.5px; padding:2px 7px; border-radius:6px; border:1px solid var(--border); color:var(--muted);}
  .order-status.executed{color:var(--up); border-color:var(--up);}
  .order-status.pending{color:var(--gold); border-color:var(--gold);}
  .order-status.rejected{color:var(--down); border-color:var(--down);}
  .order-status.cancelled{color:var(--muted);}
  .order-meta{font-size:11.5px; color:var(--muted); display:flex; justify-content:space-between;}

  .wallet-card{background:linear-gradient(135deg,var(--surface2),var(--surface)); border:1px solid var(--border); border-radius:14px; padding:16px; margin-bottom:10px;}
  .wallet-name{font-size:12.5px; color:var(--muted); display:flex; justify-content:space-between; align-items:center;}
  .wallet-balance{font-size:22px; font-weight:700; margin:6px 0 10px;}
  .holding-row{display:flex; justify-content:space-between; font-size:12px; padding:7px 0; border-top:1px solid var(--border);}
  .fab-row{display:flex; gap:8px; margin:10px 0;}

  .admin-section{margin-bottom:18px;}
  .admin-section h3{font-size:13px; color:var(--gold); margin-bottom:8px; display:flex; align-items:center; gap:6px;}
  .row2{display:flex; gap:8px;}
  .row2 > *{flex:1;}
  .mini-table{width:100%; font-size:12px; border-collapse:collapse;}
  .mini-table th{color:var(--muted); text-align:right; font-weight:500; font-size:11px; padding:6px 4px; border-bottom:1px solid var(--border);}
  .mini-table td{padding:7px 4px; border-bottom:1px solid var(--border); vertical-align:top;}
  .link-btn{background:none; border:none; color:var(--blue); font-size:11.5px; padding:2px 4px;}
  .link-btn.danger{color:var(--down);}
  .modal-bg{position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:50; display:flex; align-items:flex-end; justify-content:center;}
  .modal{background:var(--surface); border:1px solid var(--border); border-radius:16px 16px 0 0; width:100%; max-width:480px; padding:18px 16px 26px; max-height:85vh; overflow-y:auto;}
  .modal h3{font-size:15px; margin-bottom:12px;}
  .toast{position:fixed; bottom:80px; left:50%; transform:translateX(-50%); background:var(--surface2); border:1px solid var(--border); padding:10px 16px; border-radius:10px; font-size:12.5px; z-index:60; max-width:90%; text-align:center;}

  .announce-strip{display:flex; flex-direction:column; gap:6px; margin-bottom:10px;}
  .announce-item{background:var(--surface); border:1px solid var(--border); border-inline-start:3px solid var(--blue); border-radius:8px; padding:8px 10px; font-size:12px;}
  .announce-item .t{color:var(--muted); font-size:10px; margin-top:3px;}

  .lb-row{display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:10px 12px; margin-bottom:7px;}
  .lb-rank{width:24px; text-align:center; font-weight:700; color:var(--muted); font-size:13px;}
  .lb-rank.top1{color:var(--gold);} .lb-rank.top2{color:#c6c6c6;} .lb-rank.top3{color:#c98a4b;}
  .lb-name{flex:1; font-size:13px; font-weight:600;}
  .lb-val{font-size:13px; font-weight:700;}

  .badge-pill{display:inline-flex; align-items:center; gap:4px; background:var(--surface2); border:1px solid var(--border); border-radius:20px; padding:6px 10px; font-size:11px; margin:3px 4px 3px 0;}
  .badge-pill.won{border-color:var(--gold); color:var(--gold); background:var(--gold-bg);}

  .sukuk-card{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:11px 12px; margin-bottom:8px;}

  .movers-row{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px;}
  .movers-row::-webkit-scrollbar{display:none;}
  .mover-card{flex:0 0 auto; width:118px; background:var(--surface); border:1px solid var(--border); border-radius:11px; padding:9px 10px;}
  .mover-card .mn{font-size:11.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .mover-card .mp{font-size:12.5px; margin-top:4px;}
  .heatmap-grid{display:grid; grid-template-columns:1fr 1fr; gap:7px; margin-top:8px;}
  .heat-cell{border-radius:10px; padding:10px 8px; font-size:11.5px; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.35);}
  .heat-cell .hn{font-weight:700; margin-bottom:3px;}
  .onboard-step{background:var(--surface2); border-radius:10px; padding:10px 12px; margin-bottom:8px; font-size:12.5px; line-height:1.7;}
</style>
</head>
<body>
<div id="app"><div id="root"></div></div>

<script>
/* ============================= DATA / CONSTANTS ============================= */
const SECTORS = [
  {id:'banks', name:'البنوك', tpl:(r)=>`بنك ${r}`, desc:'يقدّم خدمات مصرفية للأفراد والشركات: حسابات، تمويل، وبطاقات ائتمان.'},
  {id:'telecom', name:'الاتصالات وتقنية المعلومات', tpl:(r)=>`شركة ${r} للاتصالات`, desc:'مشغّل اتصالات وخدمات إنترنت وحلول تقنية للأفراد والقطاعين العام والخاص.'},
  {id:'agri', name:'الزراعة والأغذية', tpl:(r)=>`شركة ${r} الزراعية`, desc:'إنتاج وتصنيع وتوزيع منتجات غذائية وزراعية.'},
  {id:'industry', name:'الصناعة', tpl:(r)=>`مجموعة ${r} الصناعية`, desc:'تصنيع منتجات صناعية ومعدات للسوق المحلي والتصدير.'},
  {id:'petro', name:'البتروكيماويات', tpl:(r)=>`شركة ${r} للبتروكيماويات`, desc:'إنتاج مواد بتروكيماوية أساسية ولدائن تدخل في صناعات متعددة.'},
  {id:'insurance', name:'التأمين', tpl:(r)=>`شركة ${r} للتأمين`, desc:'تقدّم وثائق تأمين صحي ومركبات وممتلكات للأفراد والشركات.'},
  {id:'retail', name:'التجزئة', tpl:(r)=>`شركة أسواق ${r}`, desc:'تشغّل سلاسل متاجر وأسواق للبيع بالتجزئة.'},
  {id:'realestate', name:'العقارات والتطوير', tpl:(r)=>`شركة ${r} العقارية`, desc:'تطوير مشاريع سكنية وتجارية وإدارة أصول عقارية.'},
  {id:'energy', name:'الطاقة والمرافق', tpl:(r)=>`شركة ${r} للطاقة`, desc:'إنتاج وتوزيع طاقة كهربائية ومرافق خدمية.'},
  {id:'transport', name:'النقل واللوجستيات', tpl:(r)=>`شركة ${r} للنقل واللوجستيات`, desc:'خدمات شحن ونقل وتخزين وسلاسل إمداد.'},
  {id:'tourism', name:'الفنادق والسياحة', tpl:(r)=>`شركة ${r} للفنادق والسياحة`, desc:'تشغّل فنادق ومنتجعات وخدمات سياحية.'},
  {id:'media', name:'الإعلام والترفيه', tpl:(r)=>`مجموعة ${r} الإعلامية`, desc:'إنتاج محتوى إعلامي وترفيهي وخدمات إعلانية.'},
  {id:'mining', name:'التعدين والمعادن', tpl:(r)=>`شركة ${r} للتعدين`, desc:'استخراج ومعالجة خامات ومعادن.'},
  {id:'health', name:'الرعاية الصحية', tpl:(r)=>`مجموعة ${r} الطبية`, desc:'تشغّل مستشفيات ومراكز طبية وخدمات رعاية صحية.'},
  {id:'fintech', name:'التقنية المالية والبرمجيات', tpl:(r)=>`شركة ${r} المالية الرقمية`, desc:'حلول دفع وبرمجيات مالية وخدمات تقنية للشركات.'},
  {id:'cement', name:'الأسمنت ومواد البناء', tpl:(r)=>`شركة أسمنت ${r}`, desc:'إنتاج أسمنت ومواد بناء لمشاريع الإنشاءات.'},
  {id:'aviation', name:'الطيران', tpl:(r)=>`شركة ${r} للطيران`, desc:'خدمات نقل جوي للركاب أو الشحن.'},
];
const NAME_ROOTS = ['التميز','الشمال','الجنوب','نماء','الرياض','الخليج','الأفق','الواحة','النخيل','الصفوة','المتقدمة','الريادة','الفا','بروج','منارة','الوادي','الساحل','الوفاء','الاتحاد','الرواد','المستقبل','الإتقان','السلام','النور','الأمانة','القمة','الرافدين','الشرق','الغد','اليمامة','الحصن','درة','سهم','الفارس','الميثاق','عين'];
const IMPACT_MULTIPLIER = 22;
const DRIFT_PCT = 0.006;
const TICK_MS = 12000;
const COMMISSION_PCT = 0.001; // 0.1% عمولة على كل صفقة
const AUTO_NEWS_CHANCE = 0.10; // احتمال ظهور خبر عشوائي في كل دورة والسوق مفتوح
const ZAKAT_RATE = 0.025;

/* ============================= STORAGE HELPERS ============================= */
/* GitHub Pages build: no server, so data is stored locally in THIS browser only via localStorage
   (not shared with other visitors/devices). Same function signatures as the Claude artifact version,
   so no other code below needed to change. */
async function sGet(key){ try{ const v = localStorage.getItem('tdwl:'+key); return v ? JSON.parse(v) : null; }catch(e){ return null; } }
async function sSet(key, val){ try{ localStorage.setItem('tdwl:'+key, JSON.stringify(val)); return {key,value:val}; }catch(e){ console.error('storage set failed', key, e); return null; } }

function rand(a,b){ return a + Math.random()*(b-a); }
function randInt(a,b){ return Math.floor(rand(a,b+1)); }
function round2(n){ return Math.round(n*100)/100; }
function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function fmt(n){ return Math.round(n).toLocaleString('en-US'); }
function fmt2(n){ return (Math.round(n*100)/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function pct(n){ return (n>=0?'+':'') + n.toFixed(2) + '%'; }
function pick(arr){ return arr[randInt(0,arr.length-1)]; }

/* ============================= MARKET GENERATION ============================= */
function weightedTier(){
  const r = Math.random();
  if(r < 0.45) return 'small';
  if(r < 0.82) return 'mid';
  return 'large';
}
function genMarket(){
  let companies = []; let idc = 1;
  SECTORS.forEach(sec=>{
    const n = randInt(7,15);
    const roots = shuffle(NAME_ROOTS).slice(0,n);
    for(let i=0;i<n;i++){
      const tier = weightedTier();
      const capRange = tier==='large' ? [3000000000,10000000000] : tier==='mid' ? [500000000,3000000000] : [50000000,500000000];
      const priceRange = tier==='large' ? [100,200] : tier==='mid' ? [40,120] : [10,50];
      let price = round2(rand(priceRange[0],priceRange[1]));
      let marketCap = rand(capRange[0],capRange[1]);
      let shares = Math.max(100000, Math.round(marketCap/price));
      const comp = {
        id:'c'+(idc++), sector:sec.id, name: sec.tpl(roots[i]), tier,
        price, open:price, prevClose:price, dayHigh:price, dayLow:price, weekOpen:price,
        allHigh:price, allLow:price, genPrice:price,
        shares, hist:[price], maker:null,
        status:'listed', halted:false, shortable: Math.random()<0.3, ipo:null
      };
      comp.marketCapNow = ()=> comp.shares*comp.price;
      companies.push(comp);
    }
  });
  return companies;
}

let STATE = {
  username:null, role:null,
  companies:[], marketOpen:true, day:1,
  wallets:[], orders:[], watchlist:[], alerts:[],
  bondOffers:[], announcements:[], trades:[], challenge:{active:false},
  theme:'dark', sound:true, lang:'ar', onboarded:false, netWorthHistory:[],
  view:'market', sectorFilter:'all', search:'',
  companyDetailId:null, tradeSide:'buy', tradeType:'market', orderTab:'pending',
  walletSel:0, adminTab:'market', modal:null, leaderboard:[], lbLoading:false, moversTab:'gainers',
};
let tickTimer = null;
let lastSeenAnnounceId = null;

function activeWallet(){ return STATE.wallets[STATE.walletSel] || STATE.wallets[0]; }
function companyById(id){ return STATE.companies.find(c=>c.id===id); }
function holdingQty(wallet, companyId){ return (wallet.holdings && wallet.holdings[companyId]) || 0; }
function netWorth(wallets){
  let total = 0;
  wallets.forEach(w=>{
    total += w.cash;
    Object.entries(w.holdings||{}).forEach(([cid,q])=>{ const c = companyById(cid); if(c) total += q*c.price; });
    (w.bonds||[]).forEach(b=> total += bondValue(b));
  });
  return total;
}
function bondValue(b){
  const days = Math.max(0,(Date.now()-b.buyTs)/86400000);
  const accrued = b.principal * (b.rate/100) * (days/365);
  return b.principal + accrued;
}
async function snapshotNetWorth(){
  if(!STATE.username) return;
  const val = round2(netWorth(STATE.wallets));
  STATE.netWorthHistory.push({ts:Date.now(), val});
  if(STATE.netWorthHistory.length>80) STATE.netWorthHistory = STATE.netWorthHistory.slice(-80);
  await sSet('nwh:'+STATE.username, STATE.netWorthHistory);
}

/* ============================= SOUND ============================= */
let audioCtx = null;
function beep(freq=880, dur=0.09){
  if(!STATE.sound) return;
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
    o.type='sine'; o.frequency.value=freq; o.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(0.06, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime+dur);
    o.start(); o.stop(audioCtx.currentTime+dur);
  }catch(e){}
}

/* ============================= BOOT / LOGIN ============================= */
async function boot(){
  let companies = await sGet('market:companies');
  let status = await sGet('market:status');
  if(!companies || !companies.length){
    companies = genMarket();
    status = {open:true, day:1};
    await sSet('market:companies', companies);
    await sSet('market:users', []);
    await sSet('market:announcements', []);
    await sSet('market:trades', []);
    await sSet('market:bonds', []);
    await sSet('market:challenge', {active:false});
  }
  STATE.companies = companies;
  attachHelpers(STATE.companies);
  STATE.marketOpen = true;
  STATE.day = (status && status.day) || 1;
  await sSet('market:status', {open:true, day:STATE.day});
  STATE.announcements = await sGet('market:announcements') || [];
  STATE.trades = await sGet('market:trades') || [];
  STATE.bondOffers = await sGet('market:bonds') || [];
  STATE.challenge = await sGet('market:challenge') || {active:false};
  if(STATE.announcements.length) lastSeenAnnounceId = STATE.announcements[0].id;
  render();
}
function attachHelpers(list){ list.forEach(c=>{ if(typeof c.marketCapNow !== 'function') c.marketCapNow = ()=> c.shares*c.price; if(c.weekOpen===undefined) c.weekOpen=c.price; if(c.allHigh===undefined){c.allHigh=c.price; c.allLow=c.price;} if(c.halted===undefined) c.halted=false; if(c.shortable===undefined) c.shortable=false; if(c.status===undefined) c.status='listed'; if(c.genPrice===undefined) c.genPrice=(c.hist&&c.hist[0])||c.price; }); }

async function doLogin(username, role){
  username = username.trim();
  if(!username){ toast('اكتب اسمًا للدخول'); return; }
  let users = await sGet('market:users') || [];
  const key = username;
  if(!users.includes(key)){ users.push(key); await sSet('market:users', users); }

  let wallets = await sGet('wallet:'+key);
  if(!wallets){ wallets = [{id:'w1', name:'المحفظة الرئيسية', cash:50000, holdings:{}, bonds:[]}]; await sSet('wallet:'+key, wallets); }
  wallets.forEach(w=>{ if(!w.bonds) w.bonds=[]; });
  let orders = await sGet('orders:'+key) || [];
  let watchlist = await sGet('watchlist:'+key) || [];
  let alerts = await sGet('alerts:'+key) || [];
  let savedRole = await sGet('role:'+key);
  if(role==='admin' && savedRole!=='admin'){ await sSet('role:'+key, 'admin'); }
  const finalRole = (role==='admin') ? 'admin' : (savedRole==='admin' ? 'admin' : 'investor');
  let theme = await sGet('theme:'+key); let sound = await sGet('sound:'+key);
  let lang = await sGet('lang:'+key);
  let onboarded = await sGet('onboarded:'+key);
  let nwh = await sGet('nwh:'+key) || [];

  STATE.username = key; STATE.role = finalRole;
  STATE.wallets = wallets; STATE.orders = orders; STATE.watchlist = watchlist; STATE.alerts = alerts;
  STATE.theme = theme || 'dark'; STATE.sound = sound===null||sound===undefined ? true : sound;
  STATE.lang = lang || 'ar'; STATE.onboarded = !!onboarded; STATE.netWorthHistory = nwh;
  document.documentElement.setAttribute('data-theme', STATE.theme);
  STATE.view = 'market';
  startTicking();
  if(!STATE.netWorthHistory.length) await snapshotNetWorth();
  if(!STATE.onboarded){ STATE.modal = {type:'onboarding'}; }
  render();
}
function logout(){ stopTicking(); STATE.username=null; STATE.role=null; STATE.wallets=[]; STATE.orders=[]; STATE.watchlist=[]; STATE.alerts=[]; render(); }

/* ============================= MARKET ENGINE ============================= */
function bandFor(c){ return {lo: c.open*0.9, hi: c.open*1.1}; }
function clampToBand(c, p){ const {lo,hi} = bandFor(c); return Math.min(Math.max(p, lo), hi); }
function changePct(c){ return ((c.price - c.prevClose)/c.prevClose)*100; }
function weeklyChangePct(c){ return ((c.price - c.weekOpen)/c.weekOpen)*100; }

function applyTradeImpact(c, side, qty){
  const notional = qty * c.price;
  const impact = notional / c.marketCapNow();
  let delta = c.price * impact * IMPACT_MULTIPLIER * (side==='buy'?1:-1);
  let np = clampToBand(c, c.price + delta);
  c.price = round2(np);
  c.dayHigh = Math.max(c.dayHigh, c.price); c.dayLow = Math.min(c.dayLow, c.price);
  c.allHigh = Math.max(c.allHigh, c.price); c.allLow = Math.min(c.allLow, c.price);
  c.hist.push(c.price); if(c.hist.length>40) c.hist.shift();
}

function marketIndex(){
  let num=0, den=0;
  STATE.companies.forEach(c=>{ if(c.status!=='listed') return; num += c.price*c.shares; den += c.genPrice*c.shares; });
  if(!den) return 1000;
  return 1000*(num/den);
}

const SECTOR_NEWS_TXT = {
  up:['ارتفاع الطلب يدفع أسهم %s للأعلى','نتائج أعمال قوية ترفع معنويات المستثمرين في %s','عقود جديدة تعزز أسهم قطاع %s'],
  down:['ضغوط تكاليف تثقل أسهم %s','تراجع الطلب يضغط على قطاع %s','مخاوف تنظيمية تهبط بأسهم %s'],
};
function triggerSectorNews(sectorId, dir, magnitudePct, auto=false){
  const sec = SECTORS.find(s=>s.id===sectorId); if(!sec) return;
  const comps = STATE.companies.filter(c=>c.sector===sectorId && c.status==='listed');
  comps.forEach(c=>{
    const delta = c.price*(magnitudePct/100)*(dir==='up'?1:-1)*rand(0.6,1);
    c.price = clampToBand(c, round2(c.price+delta));
    c.dayHigh=Math.max(c.dayHigh,c.price); c.dayLow=Math.min(c.dayLow,c.price);
    c.allHigh=Math.max(c.allHigh,c.price); c.allLow=Math.min(c.allLow,c.price);
    c.hist.push(c.price); if(c.hist.length>40) c.hist.shift();
  });
  const txt = pick(SECTOR_NEWS_TXT[dir]).replace('%s', sec.name);
  pushAnnouncement((auto?'🤖 ':'📢 ')+txt, sectorId);
}
async function pushAnnouncement(text){
  const a = {id:'a'+Date.now()+randInt(1,999), text, ts:Date.now()};
  STATE.announcements.unshift(a); STATE.announcements = STATE.announcements.slice(0,30);
  await sSet('market:announcements', STATE.announcements);
}

function driftTick(){
  if(!STATE.marketOpen) return;
  STATE.companies.forEach(c=>{
    if(c.status!=='listed') return;
    let d = c.price * rand(-DRIFT_PCT, DRIFT_PCT);
    if(c.maker && c.maker.target){ d += (c.maker.target - c.price) * (c.maker.strength||0.15); }
    let np = clampToBand(c, c.price + d);
    c.price = round2(np);
    c.dayHigh = Math.max(c.dayHigh, c.price); c.dayLow = Math.min(c.dayLow, c.price);
    c.allHigh = Math.max(c.allHigh, c.price); c.allLow = Math.min(c.allLow, c.price);
    c.hist.push(c.price); if(c.hist.length>40) c.hist.shift();
  });
  if(Math.random()<AUTO_NEWS_CHANCE){
    const sec = pick(SECTORS); const dir = Math.random()<0.5?'up':'down';
    triggerSectorNews(sec.id, dir, rand(1.5,4), true);
  }
  checkPendingOrders();
  checkAlerts();
  checkIpoAutoList();
  sSet('market:companies', STATE.companies);
  refreshSharedFeeds();
  snapshotNetWorth();
  render();
}
function checkIpoAutoList(){
  STATE.companies.forEach(c=>{
    if(c.status==='ipo' && c.ipo && c.ipo.endTs && Date.now()>=c.ipo.endTs){ listIPO(c.id); }
  });
}
async function refreshSharedFeeds(){
  const ann = await sGet('market:announcements'); if(ann) STATE.announcements = ann;
  const tr = await sGet('market:trades'); if(tr) STATE.trades = tr;
  if(STATE.announcements.length && STATE.announcements[0].id!==lastSeenAnnounceId){
    toast('📰 '+STATE.announcements[0].text); beep(660,0.12);
    lastSeenAnnounceId = STATE.announcements[0].id;
  }
}
function startTicking(){ stopTicking(); tickTimer = setInterval(driftTick, TICK_MS); }
function stopTicking(){ if(tickTimer) clearInterval(tickTimer); tickTimer=null; }

/* ============================= TRADING ============================= */
function logTrade(companyId, side, qty, price){
  STATE.trades.unshift({companyId, side, qty, price, ts:Date.now(), user:STATE.username});
  STATE.trades = STATE.trades.slice(0,200);
  sSet('market:trades', STATE.trades);
}

function submitOrder({companyId, side, type, qty, limitPrice}){
  const c = companyById(companyId);
  const w = activeWallet();
  qty = Math.max(1, Math.floor(qty||0));
  const order = {id:'o'+Date.now()+randInt(1,999), companyId, companyName:c.name, side, type, qty, limitPrice: type==='limit'?limitPrice:null, status:'pending', ts:Date.now(), walletId:w.id, execPrice:null, reason:null, isShort:false};

  if(c.status!=='listed'){ order.status='rejected'; order.reason='الشركة قيد الاكتتاب وغير مدرجة للتداول بعد'; STATE.orders.unshift(order); saveOrders(); toast('غير متاح: لم تُدرج الشركة بعد'); render(); return; }
  if(c.halted){ order.status='rejected'; order.reason='الشركة متوقفة عن التداول مؤقتًا'; STATE.orders.unshift(order); saveOrders(); toast('تم رفض الأمر: الشركة متوقفة'); render(); return; }
  if(!STATE.marketOpen){ order.status='rejected'; order.reason='السوق مغلق حاليًا'; STATE.orders.unshift(order); saveOrders(); toast('تم رفض الأمر: السوق مغلق'); render(); return; }

  const have = holdingQty(w, companyId);
  const wouldShort = side==='sell' && qty>have;
  if(wouldShort && !c.shortable){ order.status='rejected'; order.reason='الكمية غير متوفرة، والشركة لا تسمح بالبيع على المكشوف'; STATE.orders.unshift(order); saveOrders(); toast('تم رفض الأمر: أسهم غير كافية'); render(); return; }
  order.isShort = wouldShort;

  if(type==='limit'){
    const {lo,hi} = bandFor(c);
    if(limitPrice<lo || limitPrice>hi){ order.status='rejected'; order.reason=`السعر يجب أن يكون بين ${fmt2(lo)} و ${fmt2(hi)}`; STATE.orders.unshift(order); saveOrders(); toast('تم رفض الأمر: خارج نطاق ١٠٪'); render(); return; }
    if(side==='buy' && w.cash < qty*limitPrice*(1+COMMISSION_PCT)){ order.status='rejected'; order.reason='الرصيد غير كافٍ'; STATE.orders.unshift(order); saveOrders(); toast('تم رفض الأمر: رصيد غير كافٍ'); render(); return; }
    if(wouldShort && w.cash < qty*limitPrice*0.5){ order.status='rejected'; order.reason='الهامش غير كافٍ للبيع على المكشوف'; STATE.orders.unshift(order); saveOrders(); toast('تم رفض الأمر: هامش غير كافٍ'); render(); return; }
    STATE.orders.unshift(order); saveOrders(); toast('تم تسجيل أمر معلّق'); render(); return;
  }
  if(wouldShort && w.cash < qty*c.price*0.5){ order.status='rejected'; order.reason='الهامش غير كافٍ للبيع على المكشوف'; STATE.orders.unshift(order); saveOrders(); toast('تم رفض الأمر: هامش غير كافٍ'); render(); return; }
  executeOrder(order, c, w, c.price);
}

function executeOrder(order, c, w, price){
  const gross = order.qty*price;
  const commission = gross*COMMISSION_PCT;
  if(order.side==='buy'){
    const totalCost = gross+commission;
    if(w.cash < totalCost){ order.status='rejected'; order.reason='الرصيد غير كافٍ'; STATE.orders.unshift(order); saveOrders(); toast('تم رفض الأمر: رصيد غير كافٍ'); render(); return; }
    w.cash -= totalCost; w.holdings[order.companyId] = (w.holdings[order.companyId]||0) + order.qty;
    applyTradeImpact(c,'buy',order.qty);
  } else {
    const have = holdingQty(w,order.companyId);
    if(order.qty>have && !c.shortable){ order.status='rejected'; order.reason='أسهم غير كافية'; STATE.orders.unshift(order); saveOrders(); toast('تم رفض الأمر: أسهم غير كافية'); render(); return; }
    w.holdings[order.companyId] = have - order.qty; if(w.holdings[order.companyId]===0) delete w.holdings[order.companyId];
    w.cash += (gross-commission);
    applyTradeImpact(c,'sell',order.qty);
  }
  order.status='executed'; order.execPrice=price; order.commission=round2(commission);
  STATE.orders.unshift(order);
  saveOrders(); saveWallets(); sSet('market:companies', STATE.companies);
  logTrade(order.companyId, order.side, order.qty, price);
  beep(order.side==='buy'?880:520);
  toast((order.isShort?'تم فتح بيع على المكشوف — ':'') + (order.side==='buy' ? 'تم تنفيذ أمر الشراء' : 'تم تنفيذ أمر البيع') + ` (عمولة ${fmt2(commission)} ر.س)`);
  checkAchUnlocks();
  render();
}

function checkPendingOrders(){
  STATE.orders.forEach(o=>{
    if(o.status!=='pending') return;
    const c = companyById(o.companyId); if(!c || c.status!=='listed' || c.halted) return;
    const w = STATE.wallets.find(x=>x.id===o.walletId) || activeWallet();
    if(o.side==='buy' && c.price <= o.limitPrice){ executeOrder(o, c, w, c.price); }
    else if(o.side==='sell' && c.price >= o.limitPrice){ executeOrder(o, c, w, c.price); }
  });
}
function checkAlerts(){
  if(!STATE.alerts.length) return;
  let fired=false;
  STATE.alerts = STATE.alerts.filter(a=>{
    const c = companyById(a.companyId); if(!c) return false;
    const hit = a.dir==='above' ? c.price>=a.target : c.price<=a.target;
    if(hit){ toast(`🔔 ${c.name} بلغ ${fmt2(c.price)} (تنبيهك عند ${fmt2(a.target)})`); beep(1040,0.15); fired=true; return false; }
    return true;
  });
  if(fired) sSet('alerts:'+STATE.username, STATE.alerts);
}
function cancelOrder(id){ const o = STATE.orders.find(x=>x.id===id); if(o && o.status==='pending'){ o.status='cancelled'; saveOrders(); render(); } }

function saveOrders(){ sSet('orders:'+STATE.username, STATE.orders); }
function saveWallets(){ sSet('wallet:'+STATE.username, STATE.wallets); }
function saveWatchlist(){ sSet('watchlist:'+STATE.username, STATE.watchlist); }
function saveAlerts(){ sSet('alerts:'+STATE.username, STATE.alerts); }

function toggleWatch(companyId){ const i = STATE.watchlist.indexOf(companyId); if(i>=0) STATE.watchlist.splice(i,1); else STATE.watchlist.push(companyId); saveWatchlist(); render(); }
function addAlert(companyId, target, dir){ STATE.alerts.push({companyId, target:Number(target), dir}); saveAlerts(); toast('تم ضبط التنبيه'); render(); }

function createWallet(name){ STATE.wallets.push({id:'w'+Date.now(), name: name || ('محفظة '+(STATE.wallets.length+1)), cash:0, holdings:{}, bonds:[]}); saveWallets(); render(); }
function transferFunds(fromId, toId, amount){
  const f = STATE.wallets.find(w=>w.id===fromId), t = STATE.wallets.find(w=>w.id===toId);
  if(!f||!t||f===t) return toast('اختر محفظتين مختلفتين');
  amount = Number(amount);
  if(!amount || amount<=0 || f.cash < amount) return toast('مبلغ غير صالح');
  f.cash -= amount; t.cash += amount; saveWallets(); toast('تم التحويل'); render();
}

/* ============================= IPO ============================= */
function subscribeIPO(companyId, qty){
  const c = companyById(companyId); const w = activeWallet();
  qty = Math.max(1, Math.floor(qty||0));
  const cost = qty*c.ipo.price;
  if(w.cash < cost) return toast('رصيد غير كافٍ للاكتتاب');
  w.cash -= cost; w.holdings[companyId] = (w.holdings[companyId]||0)+qty;
  c.ipo.subscribed = (c.ipo.subscribed||0)+qty;
  saveWallets(); sSet('market:companies', STATE.companies);
  toast('تم الاكتتاب بنجاح'); checkAchUnlocks(); render();
}
function listIPO(companyId){
  const c = companyById(companyId); if(!c || c.status!=='ipo') return;
  c.status='listed'; c.open=c.price; c.prevClose=c.price; c.dayHigh=c.price; c.dayLow=c.price; c.weekOpen=c.price; c.genPrice=c.price;

async function payCashDividend(companyId, perShare){
  const users = await allUserKeys();
  for(const u of users){ let w = await sGet('wallet:'+u); if(!w) continue; let changed=false;
    w.forEach(wal=>{ const q = wal.holdings[companyId]; if(q>0){ wal.cash += q*perShare; changed=true; } });
    if(changed) await sSet('wallet:'+u, w);
  }
  if(STATE.wallets){ const fresh = await sGet('wallet:'+STATE.username); if(fresh) STATE.wallets = fresh; }
  pushAnnouncement(`💰 توزيع أرباح نقدية ${fmt2(perShare)} ر.س للسهم على ${companyById(companyId).name}`);
  toast('تم توزيع الأرباح النقدية'); render();
}
async function payStockDividend(companyId, pctBonus){
  const c = companyById(companyId); if(!c) return;
  const ratio = 1/(1+pctBonus/100);
  const users = await allUserKeys();
  for(const u of users){ let w = await sGet('wallet:'+u); if(!w) continue; let changed=false;
    w.forEach(wal=>{ const q = wal.holdings[companyId]; if(q>0){ const bonus = Math.floor(q*pctBonus/100); if(bonus>0){ wal.holdings[companyId]=q+bonus; changed=true; } } });
    if(changed) await sSet('wallet:'+u, w);
  }
  c.shares = Math.round(c.shares*(1+pctBonus/100));
  c.price = round2(c.price*ratio); c.open=c.price; c.prevClose=c.price; c.dayHigh=c.price; c.dayLow=c.price; c.weekOpen=c.price; c.hist.push(c.price);
  await sSet('market:companies', STATE.companies);
  if(STATE.wallets){ const fresh = await sGet('wallet:'+STATE.username); if(fresh) STATE.wallets = fresh; }
  pushAnnouncement(`🎁 منحة أسهم مجانية ${pctBonus}% على ${c.name}`);
  toast('تم توزيع الأسهم المجانية'); render();
}
async function applyLoss(companyId, pctCut){
  const c = companyById(companyId); if(!c) return;
  const ratio = 1-(pctCut/100);
  const users = await allUserKeys();
  for(const u of users){ let w = await sGet('wallet:'+u); if(!w) continue; let changed=false;
    w.forEach(wal=>{ const q = wal.holdings[companyId]; if(q>0){ const nq=Math.floor(q*ratio); if(nq!==q){ if(nq>0) wal.holdings[companyId]=nq; else delete wal.holdings[companyId]; changed=true; } } });
    if(changed) await sSet('wallet:'+u, w);
  }
  c.shares = Math.max(1000, Math.round(c.shares*ratio));
  await sSet('market:companies', STATE.companies);
  if(STATE.wallets){ const fresh = await sGet('wallet:'+STATE.username); if(fresh) STATE.wallets = fresh; }
  pushAnnouncement(`📉 خسارة وتخفيض ${pctCut}% من أسهم ${c.name}`);
  toast('تم تسجيل خسارة وتخفيض الأسهم'); render();
}

function timeAgo(ts){ const s=(Date.now()-ts)/1000; if(s<60) return 'الآن'; if(s<3600) return Math.floor(s/60)+' د'; if(s<86400) return Math.floor(s/3600)+' س'; return Math.floor(s/86400)+' ي'; }
function sparkSVG(hist, w=300, h=60){
  if(!hist || hist.length<2) hist = [hist&&hist[0]||1, hist&&hist[0]||1];
  const min = Math.min(...hist), max = Math.max(...hist);
  const range = (max-min)||1;
  const step = w/(hist.length-1);
  const pts = hist.map((v,i)=> `${(i*step).toFixed(1)},${(h-((v-min)/range)*h*0.85 - h*0.075).toFixed(1)}`).join(' ');
  const up = hist[hist.length-1] >= hist[0];
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="${up?'#21c97e':'#f0475a'}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}

function computeReport(){
  const start = STATE.netWorthHistory.length ? STATE.netWorthHistory[0].val : 50000;
  const current = netWorth(STATE.wallets);
  const gainPct = start>0 ? ((current-start)/start)*100 : 0;
  const executed = STATE.orders.filter(o=>o.status==='executed');
  const totalCommission = executed.reduce((s,o)=>s+(o.commission||0),0);
  let largest = null;
  executed.forEach(o=>{ const notional = o.qty*o.execPrice; if(!largest || notional>largest.notional) largest = {notional, o}; });
  const sectorVal = {};
  STATE.wallets.forEach(w=> Object.entries(w.holdings||{}).forEach(([cid,q])=>{ if(q<=0) return; const c=companyById(cid); if(!c) return; sectorVal[c.sector]=(sectorVal[c.sector]||0)+q*c.price; }));
  const totalInvested = Object.values(sectorVal).reduce((a,b)=>a+b,0);
  const allocation = Object.entries(sectorVal).map(([sid,val])=>({name:sectorName(sid), pct: totalInvested? (val/totalInvested)*100 : 0})).sort((a,b)=>b.pct-a.pct).slice(0,5);
  return {start, current, gainPct, tradesCount:executed.length, totalCommission, largest, allocation};
}

function renderModal(){
  const m = STATE.modal; let inner = '';
  if(m.type==='addCompany'){
    inner = `<h3>إضافة شركة جديدة</h3>
    <div class="field"><label>القطاع</label><select id="mSector">${SECTORS.map(s=>`<option value="${s.id}">${s.name}</option>`).join('')}</select></div>
    <div class="field"><label>اسم الشركة</label><input id="mName" placeholder="مثال: شركة الرافدين للطاقة"/></div>
    <div class="row2">
      <div class="field"><label>سعر السهم (١٠-٢٠٠)</label><input id="mPrice" type="number" value="50"/></div>
      <div class="field"><label>رأس المال (ر.س)</label><input id="mCap" type="number" value="500000000"/></div>
    </div>
    <div class="field"><label><input type="checkbox" id="mShortable" style="width:auto; display:inline-block;"/> السماح بالبيع على المكشوف</label></div>
    <div class="field"><label><input type="checkbox" id="mIsIpo" style="width:auto; display:inline-block;"/> طرحها كاكتتاب أولي (IPO) بدل الإدراج المباشر</label></div>
    <div class="field"><label>مدة فترة الاكتتاب بالساعات (اختياري — يُدرج تلقائيًا بعدها)</label><input id="mIpoHours" type="number" placeholder="مثال: 24"/></div>
    <button class="btn btn-primary" id="mSubmit">إضافة</button>`;
  } else if(m.type==='editPrice'){
    const c = companyById(m.companyId);
    inner = `<h3>تعديل سعر: ${c.name}</h3><div class="field"><label>السعر الجديد</label><input id="mPrice2" type="number" step="0.01" value="${c.price}"/></div><button class="btn btn-primary" id="mSubmit2">حفظ</button>`;
  } else if(m.type==='newWallet'){
    inner = `<h3>محفظة جديدة</h3><div class="field"><label>اسم المحفظة</label><input id="mWName" placeholder="مثال: محفظة المضاربة"/></div><button class="btn btn-primary" id="mWSubmit">إنشاء</button>`;
  } else if(m.type==='transfer'){
    inner = `<h3>تحويل بين المحافظ</h3>
    <div class="field"><label>من</label><select id="tFrom">${STATE.wallets.map(w=>`<option value="${w.id}">${w.name} (${fmt(w.cash)})</option>`).join('')}</select></div>
    <div class="field"><label>إلى</label><select id="tTo">${STATE.wallets.map(w=>`<option value="${w.id}">${w.name} (${fmt(w.cash)})</option>`).join('')}</select></div>
    <div class="field"><label>المبلغ</label><input id="tAmt" type="number" value="1000"/></div>
    <button class="btn btn-primary" id="tSubmit">تحويل</button>`;
  } else if(m.type==='onboarding'){
    inner = `<h3>👋 أهلًا بك في السوق الافتراضي</h3>
    <div class="onboard-step">💰 لديك رصيد ابتدائي ٥٠,٠٠٠ ر.س في محفظتك الرئيسية.</div>
    <div class="onboard-step">📈 سعر أي سهم لا يتحرك أكثر من ±١٠٪ في اليوم الواحد — هذا هو نطاق التداول اليومي.</div>
    <div class="onboard-step">🛒 افتح أي شركة من "السوق" لشراء أو بيع أسهمها بأمر سوق فوري أو أمر محدد بسعر معلّق.</div>
    <div class="onboard-step">⭐ استخدم "المفضلة" لمتابعة الأسهم التي تهمك، و🔔 لضبط تنبيه سعري.</div>
    <div class="onboard-step">💼 يمكنك إنشاء محافظ إضافية والتحويل بينها من صفحة "المحفظة"، وفيها أيضًا الصكوك وحاسبة الزكاة وتقرير أدائك.</div>
    <div class="onboard-step">🏆 تابع ترتيب الحسابات التي جرّبتها على هذا الجهاز من "المتصدرون" (الترتيب هنا محلي على متصفحك فقط).</div>
    <button class="btn btn-primary" id="onboardDoneBtn">فهمت، ابدأ التداول</button>`;
  }
  return `<div class="modal-bg" id="modalBg"><div class="modal">${inner}${m.type!=='onboarding'?'<button class="btn btn-ghost" id="modalClose" style="margin-top:10px;">إغلاق</button>':''}</div></div>`;
}

/* ============================= EVENTS ============================= */
function attachAppEvents(){
  document.querySelectorAll('[data-nav]').forEach(b=> b.onclick = ()=>{ STATE.view = b.dataset.nav; if(STATE.view==='leaderboard' && !STATE.leaderboard.length) loadLeaderboard(); render(); });
  const logoutBtn = document.getElementById('logoutBtn'); if(logoutBtn) logoutBtn.onclick = logout;
  const themeToggle = document.getElementById('themeToggle');
  if(themeToggle) themeToggle.onclick = ()=>{ STATE.theme = STATE.theme==='dark'?'light':'dark'; document.documentElement.setAttribute('data-theme', STATE.theme); sSet('theme:'+STATE.username, STATE.theme); render(); };
  const soundToggle = document.getElementById('soundToggle');
  if(soundToggle) soundToggle.onclick = ()=>{ STATE.sound = !STATE.sound; sSet('sound:'+STATE.username, STATE.sound); render(); };
  const langToggle = document.getElementById('langToggle');
  if(langToggle) langToggle.onclick = ()=>{ STATE.lang = STATE.lang==='ar'?'en':'ar'; sSet('lang:'+STATE.username, STATE.lang); render(); };

  const s = document.getElementById('searchInput');
  if(s){ s.oninput = ()=>{ STATE.search = s.value; render(); const el=document.getElementById('searchInput'); if(el){ el.focus(); el.selectionStart=el.selectionEnd=el.value.length; } }; }
  document.querySelectorAll('[data-sector]').forEach(b=> b.onclick = ()=>{ STATE.sectorFilter = b.dataset.sector; STATE.view='market'; render(); });
  document.querySelectorAll('[data-movers]').forEach(b=> b.onclick = ()=>{ STATE.moversTab = b.dataset.movers; render(); });
  document.querySelectorAll('[data-open]').forEach(el=> el.onclick = ()=>{ STATE.companyDetailId = el.dataset.open; STATE.view='company'; STATE.tradeType='market'; render(); });
  document.querySelectorAll('[data-star]').forEach(el=> el.onclick = (e)=>{ e.stopPropagation(); toggleWatch(el.dataset.star); });

  const backBtn = document.getElementById('backToMarket'); if(backBtn) backBtn.onclick = ()=>{ STATE.view='market'; render(); };
  document.querySelectorAll('[data-side]').forEach(b=> b.onclick=()=>{ STATE.tradeSide=b.dataset.side; render(); });
  document.querySelectorAll('[data-type]').forEach(b=> b.onclick=()=>{ STATE.tradeType=b.dataset.type; render(); });
  const qtyInput = document.getElementById('qtyInput');
  if(qtyInput){
    const updateEst = ()=>{
      const c = companyById(STATE.companyDetailId);
      const lpEl = document.getElementById('limitPriceInput');
      const price = STATE.tradeType==='limit' && lpEl ? Number(lpEl.value||c.price) : c.price;
      const q = Number(qtyInput.value||0);
      const est = document.getElementById('estTotal'); if(est) est.textContent = fmt(price*q) + ' ر.س';
      const comm = document.getElementById('estComm'); if(comm) comm.textContent = fmt2(price*q*COMMISSION_PCT) + ' ر.س';
    };
    qtyInput.oninput = updateEst;
    const lp = document.getElementById('limitPriceInput'); if(lp) lp.oninput = updateEst;
    document.getElementById('qtyMinus').onclick = ()=>{ qtyInput.value = Math.max(1, Number(qtyInput.value||1)-10); updateEst(); };
    document.getElementById('qtyPlus').onclick = ()=>{ qtyInput.value = Number(qtyInput.value||0)+10; updateEst(); };
    updateEst();
  }
  const submitTrade = document.getElementById('submitTradeBtn');
  if(submitTrade){
    submitTrade.onclick = ()=>{
      const qty = Number(document.getElementById('qtyInput').value||0);
      const lpEl = document.getElementById('limitPriceInput');
      const limitPrice = STATE.tradeType==='limit' && lpEl ? Number(lpEl.value||0) : null;
      submitOrder({companyId: STATE.companyDetailId, side: STATE.tradeSide, type: STATE.tradeType, qty, limitPrice});
    };
  }
  const setAlertBtn = document.getElementById('setAlertBtn');
  if(setAlertBtn) setAlertBtn.onclick = ()=> addAlert(STATE.companyDetailId, document.getElementById('alertPrice').value, document.getElementById('alertDir').value);
  const ipoBtn = document.getElementById('ipoSubmitBtn');
  if(ipoBtn) ipoBtn.onclick = ()=> subscribeIPO(STATE.companyDetailId, document.getElementById('ipoQty').value);
  const ipoListBtn = document.getElementById('ipoListBtn');
  if(ipoListBtn) ipoListBtn.onclick = ()=> listIPO(STATE.companyDetailId);

  document.querySelectorAll('[data-ordertab]').forEach(b=> b.onclick=()=>{ STATE.orderTab=b.dataset.ordertab; render(); });
  document.querySelectorAll('[data-cancel]').forEach(b=> b.onclick=()=> cancelOrder(b.dataset.cancel));

  document.querySelectorAll('[data-walletsel]').forEach(b=> b.onclick=()=>{ STATE.walletSel = Number(b.dataset.walletsel); render(); });
  const nw = document.getElementById('newWalletBtn'); if(nw) nw.onclick = ()=>{ STATE.modal={type:'newWallet'}; render(); };
  const tb = document.getElementById('transferBtn'); if(tb) tb.onclick = ()=>{ STATE.modal={type:'transfer'}; render(); };
  document.querySelectorAll('[data-buybond]').forEach(b=> b.onclick=()=>{ const amtEl = document.querySelector(`.bondAmt[data-offer="${b.dataset.buybond}"]`); buyBond(b.dataset.buybond, amtEl.value); });
  document.querySelectorAll('[data-redeem]').forEach(b=> b.onclick=()=> redeemBond(b.dataset.redeem));

  const refreshLbBtn = document.getElementById('refreshLbBtn'); if(refreshLbBtn) refreshLbBtn.onclick = loadLeaderboard;

  document.querySelectorAll('[data-admintab]').forEach(b=> b.onclick=()=>{ STATE.adminTab=b.dataset.admintab; render(); });
  const newDayBtn = document.getElementById('newDayBtn'); if(newDayBtn) newDayBtn.onclick = adminStartNewDay;
  const broadcastBtn = document.getElementById('broadcastBtn'); if(broadcastBtn) broadcastBtn.onclick = ()=> adminBroadcast(document.getElementById('broadcastText').value);
  const addC = document.getElementById('addCompanyBtn'); if(addC) addC.onclick = ()=>{ STATE.modal={type:'addCompany'}; render(); };
  document.querySelectorAll('[data-editprice]').forEach(b=> b.onclick=()=>{ STATE.modal={type:'editPrice', companyId:b.dataset.editprice}; render(); });
  document.querySelectorAll('[data-delcompany]').forEach(b=> b.onclick=()=>{ if(confirm('تأكيد حذف الشركة؟')) adminDeleteCompany(b.dataset.delcompany); });
  document.querySelectorAll('[data-halt]').forEach(b=> b.onclick=()=> adminToggleHalt(b.dataset.halt));
  document.querySelectorAll('[data-short]').forEach(b=> b.onclick=()=> adminToggleShortable(b.dataset.short));
  document.querySelectorAll('[data-listipo]').forEach(b=> b.onclick=()=> listIPO(b.dataset.listipo));

  const divCashBtn = document.getElementById('divCashBtn'); if(divCashBtn) divCashBtn.onclick = ()=> payCashDividend(document.getElementById('divCashCompany').value, Number(document.getElementById('divCashAmt').value||0));
  const divStockBtn = document.getElementById('divStockBtn'); if(divStockBtn) divStockBtn.onclick = ()=> payStockDividend(document.getElementById('divStockCompany').value, Number(document.getElementById('divStockPct').value||0));
  const lossBtn = document.getElementById('lossBtn'); if(lossBtn) lossBtn.onclick = ()=> applyLoss(document.getElementById('lossCompany').value, Number(document.getElementById('lossPct').value||0));

  const makerSet = document.getElementById('makerSetBtn'); if(makerSet) makerSet.onclick = ()=> setMakerMode(document.getElementById('makerCompany').value, document.getElementById('makerTarget').value, document.getElementById('makerStrength').value);
  const makerOff = document.getElementById('makerOffBtn'); if(makerOff) makerOff.onclick = ()=> setMakerMode(document.getElementById('makerCompany').value, null);

  const newsSubmitBtn = document.getElementById('newsSubmitBtn');
  if(newsSubmitBtn) newsSubmitBtn.onclick = ()=> triggerSectorNews(document.getElementById('newsSector').value, document.getElementById('newsDir').value, Number(document.getElementById('newsMag').value||3)) || render();

  const bondAddBtn = document.getElementById('bondAddBtn');
  if(bondAddBtn) bondAddBtn.onclick = ()=> adminAddBondOffer(document.getElementById('bondName').value||'صك جديد', document.getElementById('bondRate').value, document.getElementById('bondMin').value);
  document.querySelectorAll('[data-togglebond]').forEach(b=> b.onclick=()=> adminToggleBondOffer(b.dataset.togglebond));

  const startChallengeBtn = document.getElementById('startChallengeBtn'); if(startChallengeBtn) startChallengeBtn.onclick = ()=> adminStartChallenge(document.getElementById('challengeName').value);
  const endChallengeBtn = document.getElementById('endChallengeBtn'); if(endChallengeBtn) endChallengeBtn.onclick = adminEndChallenge;

  const modalBg = document.getElementById('modalBg');
  if(modalBg){
    modalBg.addEventListener('click', (e)=>{ if(e.target.id==='modalBg'){ closeModal(); } });
    const mc = document.getElementById('modalClose'); if(mc) mc.onclick = closeModal;
    const odb = document.getElementById('onboardDoneBtn'); if(odb) odb.onclick = closeModal;
    const mSubmit = document.getElementById('mSubmit');
    if(mSubmit) mSubmit.onclick = ()=>{
      const name = document.getElementById('mName').value.trim();
      const price = Number(document.getElementById('mPrice').value||10);
      const cap = Number(document.getElementById('mCap').value||50000000);
      const sector = document.getElementById('mSector').value;
      const shortable = document.getElementById('mShortable').checked;
      const isIpo = document.getElementById('mIsIpo').checked;
      const ipoHours = document.getElementById('mIpoHours').value;
      if(!name) return toast('اكتب اسم الشركة');
      adminAddCompany({name, price, marketCap:cap, sector, shortable, isIpo, ipoHours});
      STATE.modal=null; render();
    };
    const mSubmit2 = document.getElementById('mSubmit2');
    if(mSubmit2) mSubmit2.onclick = ()=>{ adminSetPrice(STATE.modal.companyId, document.getElementById('mPrice2').value); STATE.modal=null; render(); };
    const mWSubmit = document.getElementById('mWSubmit');
    if(mWSubmit) mWSubmit.onclick = ()=>{ createWallet(document.getElementById('mWName').value); STATE.modal=null; render(); };
    const tSubmit = document.getElementById('tSubmit');
    if(tSubmit) tSubmit.onclick = ()=>{ transferFunds(document.getElementById('tFrom').value, document.getElementById('tTo').value, document.getElementById('tAmt').value); STATE.modal=null; render(); };
  }
}

boot();
</script>
